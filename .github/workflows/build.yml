name: Build & Release FinLegal-Chat Ultimate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 5.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Create assets directory
        run: mkdir -p assets

      - name: Build with PyInstaller
        run: |
          pyinstaller FinLegal-Chat.spec --noconfirm --clean
        env:
          PYTHONIOENCODING: utf-8

      - name: Create archive
        run: |
          cd dist/FinLegal-Chat-Ultimate
          7z a -tzip ../../FinLegal-Chat-Ultimate-Windows.zip .
        shell: bash

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=5.0.0-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: "FinLegal-Chat Ultimate v${{ steps.version.outputs.VERSION }}"
          body: |
            ## FinLegal-Chat Ultimate v${{ steps.version.outputs.VERSION }}

            ### What's New
            - Complete UI overhaul with professional dark theme
            - Multi-agent AI pipeline (Legal, Financial, Market, Risk)
            - Session management with persistent chat history
            - Advanced document ingestion (PDF, DOCX, TXT, CSV)
            - Automated report generation (Word & Excel)
            - Settings persistence with secure API key storage
            - Interactive data visualization
            - RTL language support (Persian, Arabic)
            - Commercial-grade architecture

            ### Installation
            1. Download `FinLegal-Chat-Ultimate-Windows.zip`
            2. Extract the archive
            3. Run `FinLegal-Chat-Ultimate.exe`
            4. Enter your OpenAI API key in Settings (or use Local Mode with Ollama)
            5. Upload documents and start analyzing!

            ### System Requirements
            - Windows 10/11 (64-bit)
            - 4 GB RAM minimum (8 GB recommended)
            - Internet connection (for Cloud Mode)
            - Ollama installed (for Local Privacy Mode)
          files: |
            FinLegal-Chat-Ultimate-Windows.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'dev') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
