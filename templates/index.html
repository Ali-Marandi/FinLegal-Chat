<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinLegal AI Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .chat-container { max-width: 800px; margin: 50px auto; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .chat-header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .chat-box { height: 500px; overflow-y: auto; padding: 20px; border-bottom: 1px solid #eee; }
        .message { margin-bottom: 20px; padding: 10px 15px; border-radius: 10px; max-width: 80%; }
        .user-message { background: #007bff; color: white; margin-left: auto; }
        .bot-message { background: #e9ecef; color: #333; }
        .chat-input { padding: 20px; display: flex; gap: 10px; }
        #user-input { flex-grow: 1; border-radius: 25px; padding: 10px 20px; border: 1px solid #ddd; }
        #send-btn { border-radius: 25px; padding: 10px 25px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3>FinLegal AI Assistant</h3>
            <p class="mb-0">Professional Financial & Legal Support</p>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                Hello! I am your FinLegal AI assistant. How can I help you with your financial or legal questions today?
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your question here..." aria-label="User input">
            <button class="btn btn-primary" id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (isUser ? 'user-message' : 'bot-message');
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.onclick = async () => {
            const text = userInput.value.trim();
            if (!text) return;
            
            appendMessage(text, true);
            userInput.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage(data.response, false);
            } catch (error) {
                appendMessage("Sorry, I encountered an error. Please try again.", false);
            }
        };

        userInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };
    </script>
</body>
</html>
